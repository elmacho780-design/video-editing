  <script>
    (function () {
      const DURATION = 10;

      // ---------------------------------------------------------------- math
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const lerp = (a, b, p) => a + (b - a) * p;
      const TAU = Math.PI * 2;
      const E = {
        lin: (p) => p,
        inQ: (p) => p * p,
        outQ: (p) => 1 - (1 - p) * (1 - p),
        inC: (p) => p * p * p,
        outC: (p) => 1 - Math.pow(1 - p, 3),
        inOutC: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
        outE: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
        inOutS: (p) => -(Math.cos(Math.PI * p) - 1) / 2,
        outB: (p, s = 1.70158) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2),
        elastic: (p, per = 0.38) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin(((p - per / 4) * TAU) / per) + 1),
      };
      // keyframe track: [[t, value(number|array), ease?], ...]; ease applies to the segment arriving at that key
      function track(t, keys) {
        if (t <= keys[0][0]) return keys[0][1];
        for (let i = 1; i < keys.length; i++) {
          if (t <= keys[i][0]) {
            const [t0, v0] = keys[i - 1];
            const [t1, v1, ez] = keys[i];
            const p = (ez || E.inOutC)((t - t0) / (t1 - t0));
            return Array.isArray(v0) ? v0.map((v, j) => lerp(v, v1[j], p)) : lerp(v0, v1, p);
          }
        }
        return keys[keys.length - 1][1];
      }
      // a damped bump: 0 before t0, kicks to `amp`, rings out
      function ring(t, t0, amp, decay = 7, freq = 13, rise = 0.05) {
        if (t < t0) return 0;
        const d = t - t0;
        return amp * Math.min(1, d / rise) * Math.exp(-decay * d) * Math.cos(freq * d);
      }
      function blinkAt(t, times, w = 0.13) {
        let b = 0;
        for (const bt of times) {
          const d = Math.abs(t - bt) / (w / 2);

        }
        return b;
      }
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let r = Math.imul(a ^ (a >>> 15), 1 | a);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }

      // ---------------------------------------------------------------- renderer
      const canvas = document.getElementById("f-canvas");

      // soft studio environment for reflections (a small light box, baked once)
      function makeEnv() {
        const pm = new THREE.PMREMGenerator(renderer);
        const s = new THREE.Scene();
        const room = new THREE.Mesh(new THREE.BoxGeometry(20, 20, 20), new THREE.MeshBasicMaterial({ color: 0xc9b8b4, side: THREE.BackSide }));
        s.add(room);
        const panel = (w, h, c, x, y, z, ry, rx) => {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
          m.position.set(x, y, z); m.rotation.y = ry || 0; m.rotation.x = rx || 0;
          s.add(m);
        };
        const k = new THREE.Color(0xffffff).multiplyScalar(6);
        panel(8, 5, k, -6, 5, 6, Math.PI / 4, 0);
        panel(5, 8, new THREE.Color(0xfff0f4).multiplyScalar(3.5), 8, 3, -2, -Math.PI / 2, 0);
        panel(14, 4, new THREE.Color(0xffffff).multiplyScalar(4), 0, 9.5, 0, 0, Math.PI / 2);
        panel(3, 6, new THREE.Color(0xffd6e6).multiplyScalar(3), -3, 2, -8, 0, 0);
        const tex = pm.fromScene(s, 0.03).texture;
        pm.dispose();
        return tex;
      }
      const envTex = makeEnv();

      // ---------------------------------------------------------------- geometry helpers
      function roundedBox(w, h, d, r, seg = 5) {
        const iw = w - 2 * r, ih = h - 2 * r, cr = Math.min(iw, ih) * 0.22;
        const s = new THREE.Shape();
        const x0 = -iw / 2, y0 = -ih / 2;
        s.moveTo(x0 + cr, y0);
        s.lineTo(x0 + iw - cr, y0);
        s.quadraticCurveTo(x0 + iw, y0, x0 + iw, y0 + cr);
        s.lineTo(x0 + iw, y0 + ih - cr);
        s.quadraticCurveTo(x0 + iw, y0 + ih, x0 + iw - cr, y0 + ih);
        s.lineTo(x0 + cr, y0 + ih);
        s.quadraticCurveTo(x0, y0 + ih, x0, y0 + ih - cr);
        s.lineTo(x0, y0 + cr);
        s.quadraticCurveTo(x0, y0, x0 + cr, y0);
        const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: seg, curveSegments: 14 });
        g.center();
        g.computeVertexNormals();
        return g;
      }
      function heartShape() {
        const s = new THREE.Shape();
        s.moveTo(0, -0.95);
        s.bezierCurveTo(-0.15, -0.8, -1.0, -0.3, -1.0, 0.3);
        s.bezierCurveTo(-1.0, 0.75, -0.65, 0.98, -0.45, 0.98);
        s.bezierCurveTo(-0.2, 0.98, -0.05, 0.82, 0, 0.62);
        s.bezierCurveTo(0.05, 0.82, 0.2, 0.98, 0.45, 0.98);
        s.bezierCurveTo(0.65, 0.98, 1.0, 0.75, 1.0, 0.3);
        s.bezierCurveTo(1.0, -0.3, 0.15, -0.8, 0, -0.95);
        return s;
      }
      function puffyHeart() {
        const g = new THREE.ExtrudeGeometry(heartShape(), { depth: 0.32, bevelEnabled: true, bevelThickness: 0.3, bevelSize: 0.2, bevelSegments: 10, curveSegments: 28 });
        g.center();
        g.computeVertexNormals();
        return g;
      }
      function starShape(ro = 1, ri = 0.5) {
        const s = new THREE.Shape();
        for (let i = 0; i < 10; i++) {
          const r = i % 2 ? ri : ro, a = Math.PI / 2 + (i * Math.PI) / 5;

        return s;

      const G = {
        heart: puffyHeart(),
        star: puffyStar(),

      // ---------------------------------------------------------------- materials

        ink: glossy("#1b0f0c", { roughness: 0.18, envMapIntensity: 1.3 }),

        sparkleY: new THREE.MeshBasicMaterial({ color: "#ffe680", transparent: true, side: THREE.DoubleSide, toneMapped: false }),
      };

      // ---------------------------------------------------------------- Clawd
      function makeClawd() {
        const c = {};
        c.root = new THREE.Group();
        c.hop = new THREE.Group(); c.root.add(c.hop);
        c.squash = new THREE.Group(); c.hop.add(c.squash);
        c.lean = new THREE.Group(); c.squash.add(c.lean);
        const legGeo = roundedBox(0.15, 0.34, 0.44, 0.06);
        c.legs = [-0.5625, -0.3125, 0.3125, 0.5625].map((x) => {

        c.body = new THREE.Group(); c.lean.add(c.body);

        // arms: pivot at the shoulder, scale group for rubber-hose stretch

        const arm = (side) => {
          const pivot = new THREE.Group();

          const m = new THREE.Mesh(armGeo, M.clawd);

          m.castShadow = true;
          sc.add(m);
          c.body.add(pivot);
          const hand = new THREE.Mesh(G.sphere, M.clawd);
          hand.scale.set(0.13, 0.13, 0.17);
          hand.castShadow = true;
          hand.visible = false;
          pivot.add(hand);
          return { pivot, sc, hand, side };
        };
        c.armL = arm(-1);
        c.armR = arm(1);
        // face
        c.face = new THREE.Group(); c.face.position.z = 0.476; c.body.add(c.face);
        c.eyes = new THREE.Group(); c.face.add(c.eyes);
        const eyeGeo = roundedBox(0.135, 0.27, 0.05, 0.045);
        c.eyesN = new THREE.Group(); c.eyes.add(c.eyesN);
        c.eyeL = new THREE.Mesh(eyeGeo, M.ink); c.eyeL.position.set(-0.44, 0.9, 0); c.eyesN.add(c.eyeL);
        c.eyeR = new THREE.Mesh(eyeGeo, M.ink); c.eyeR.position.set(0.44, 0.9, 0); c.eyesN.add(c.eyeR);
        // a tiny catch-light keeps the toy alive
        [c.eyeL, c.eyeR].forEach((e) => {
          const h = new THREE.Mesh(G.sphere, M.white); h.scale.setScalar(0.022); h.position.set(-0.025, 0.07, 0.03); e.add(h);
        });
        c.eyesP = new THREE.Group(); c.eyes.add(c.eyesP);
        const pGeo = roundedBox(0.21, 0.31, 0.05, 0.08);
        c.pEyes = [-0.44, 0.44].map((x) => {
          const g = new THREE.Group(); g.position.set(x, 0.9, 0);
          g.add(new THREE.Mesh(pGeo, M.ink));
          const h1 = new THREE.Mesh(G.sphere, M.white); h1.scale.setScalar(0.042); h1.position.set(-0.035, 0.065, 0.035); g.add(h1);
          const h2 = new THREE.Mesh(G.sphere, M.white); h2.scale.setScalar(0.02); h2.position.set(0.045, -0.07, 0.035); g.add(h2);
          c.eyesP.add(g);
          return g;
        });
        c.eyesH = new THREE.Group(); c.eyes.add(c.eyesH);
        const happyGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(-0.1, -0.045, 0), new THREE.Vector3(-0.05, 0.03, 0), new THREE.Vector3(0, 0.06, 0), new THREE.Vector3(0.05, 0.03, 0), new THREE.Vector3(0.1, -0.045, 0)]), 24, 0.03, 10, false);
        [-0.44, 0.44].forEach((x) => { const m = new THREE.Mesh(happyGeo, M.ink); m.position.set(x, 0.9, 0.01); c.eyesH.add(m); });
        const blushGeo = new THREE.CircleGeometry(0.09, 32);
        c.blush = [-0.6, 0.6].map((x) => { const m = new THREE.Mesh(blushGeo, M.blush); m.scale.set(1.55, 1, 1); m.position.set(x, 0.7, 0.012); c.face.add(m); return m; });
        const mouthCurve = (pts) => new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[0], p[1], 0))), 16, 0.02, 8, false);
        c.mouthSad = new THREE.Mesh(mouthCurve([[-0.065, -0.018], [0, 0.022], [0.065, -0.018]]), M.ink); c.mouthSad.position.set(0, 0.68, 0.01); c.face.add(c.mouthSad);
        c.tear = new THREE.Mesh(G.sphere, M.tear); c.tear.scale.set(0.045, 0.06, 0.035); c.face.add(c.tear);
        return c;
      }
      // pose: everything Clawd does in one frame
      function poseClawd(c, p) {
        c.root.position.set(p.x || 0, 0, p.z || 0);
        c.root.rotation.y = p.rotY || 0;
        c.hop.position.y = p.hopY || 0;
        const sy = p.sqY || 1, sxz = 1 / Math.sqrt(sy);
        c.squash.scale.set(sxz, sy, sxz);
        c.lean.rotation.z = p.leanZ || 0;
        c.lean.rotation.x = p.leanX || 0;
        const lifts = p.legs || [0, 0, 0, 0];
        c.legs.forEach((m, i) => (m.position.y = 0.17 + lifts[i]));
        c.body.position.y = p.bob || 0;
        c.armL.pivot.rotation.set(0, p.armLy || 0, p.armL || 0);
        c.armR.pivot.rotation.set(0, p.armRy || 0, p.armR || 0);
        c.armL.sc.scale.x = p.armLs || 1;
        c.armR.sc.scale.x = p.armRs || 1;
        [c.armL, c.armR].forEach((a) => {
          const s = a.sc.scale.x;
          a.hand.visible = s > 1.4;
          a.hand.position.x = a.side * 0.31 * s;
        });
        const st = p.eyes || "n";
        c.eyesN.visible = st === "n";
        c.eyesP.visible = st === "p";
        c.eyesH.visible = st === "h";
        const bl = 1 - 0.9 * (p.blink || 0);
        c.eyeL.scale.y = c.eyeR.scale.y = bl;
        c.pEyes.forEach((g) => (g.scale.y = bl));
        c.eyes.position.set(p.lookX || 0, p.lookY || 0, 0);
        M.blush.opacity = 0.85 * (p.blush || 0);
        c.mouthSad.visible = !!p.sad;
        const tp = p.tear || 0;
        c.tear.visible = tp > 0 && tp < 1;
        c.tear.position.set(0.5, 0.8 - 0.22 * E.inQ(tp), 0.02);
      }

      // ---------------------------------------------------------------- the poster canvas
      const PW = 5.4, PH = 3.0, CW = 2300, CH = 1278;
      const pc = document.createElement("canvas"); pc.width = CW; pc.height = CH;
      const px = pc.getContext("2d");
      const paperBase = document.createElement("canvas"); paperBase.width = CW; paperBase.height = CH;
      const posterTex = new THREE.CanvasTexture(pc);

      posterTex.repeat.set(1, 0);

      function heartPath2d(ctx, cx, cy, s) {
        // the same heart as the title, centred, s = width in px
        const k = s / 100, X = (x) => cx + (x - 50) * k, Y = (y) => cy + (y - 45) * k;
        ctx.beginPath();
        ctx.moveTo(X(50), Y(88));
        ctx.bezierCurveTo(X(20), Y(66), X(2), Y(48), X(2), Y(28));
        ctx.bezierCurveTo(X(2), Y(13), X(13), Y(2), X(27), Y(2));
        ctx.bezierCurveTo(X(37), Y(2), X(45), Y(8), X(50), Y(17));
        ctx.bezierCurveTo(X(55), Y(8), X(63), Y(2), X(73), Y(2));
        ctx.bezierCurveTo(X(87), Y(2), X(98), Y(13), X(98), Y(28));
        ctx.bezierCurveTo(X(98), Y(48), X(80), Y(66), X(50), Y(88));
        ctx.closePath();
      }
      function starPath2d(ctx, cx, cy, ro, ri, rot = 0) {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const r = i % 2 ? ri : ro, a = -Math.PI / 2 + rot + (i * Math.PI) / 5;
          const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.closePath();
      }
      function sparklePath2d(ctx, cx, cy, r) {

      const ringKinds = ["heartA", "star", "cloud", "heartB", "candy", "flower", "heartC", "starB", "balloon", "heartA", "candyB", "star", "cloud", "heartB", "flower", "heartC", "star", "candy", "heartA", "starB", "balloon", "heartB", "cloud", "flower"];

      function studioCamera(t) {

      function studioClawd(t) {
        const p = { x: -2.3, z: 0, eyes: "n" };
        // 1. peek, dip, spring up, land
        p.hopY = track(t, [[0, -1.84], [0.24, -1.84], [0.36, -2.1, E.outQ], [0.76, 0.92, E.outC], [0.98, 0, E.inQ]]);
        let sq = track(t, [[0, 1], [0.24, 1], [0.36, 0.84, E.outQ], [0.48, 1.2, E.outQ], [0.76, 1.0, E.inOutS], [0.9, 1.08, E.inQ], [0.98, 1.0, E.lin]]);
        if (t > 0.98) sq = 1 - 0.27 * Math.min(1, (t - 0.98) / 0.045) * Math.exp(-6.5 * (t - 0.98)) * Math.cos(15 * (t - 0.98));
        p.armL = track(t, [[0.36, 0], [0.5, -0.5, E.outQ], [0.8, 0.3, E.inOutS], [1.0, 0, E.inOutS]]);
        p.armR = -p.armL;

        const W0 = 1.45, W1 = 3.45, N = 8, ST = (W1 - W0) / N;
        p.rotY = track(t, [[1.12, 0], [1.38, 0.62, (q) => E.outB(q, 2)], [3.45, 0.62], [3.75, -0.08, E.outC], [3.95, 0, E.inOutS]]);

        p.legs = [0, 0, 0, 0];
        p.bob = 0;
        p.leanZ = 0;
        if (t > W0 && t < W1) {
          const s = (t - W0) / ST, k = Math.floor(s), ph = s - k;
          const env = Math.min(1, (t - W0) / 0.12, (W1 - t) / 0.12);
          const lift = Math.sin(Math.PI * ph) * 0.1 * env;
          if (k % 2 === 0) { p.legs[0] = lift; p.legs[2] = lift; } else { p.legs[1] = lift; p.legs[3] = lift; }
          p.bob = Math.abs(Math.sin(Math.PI * ph)) * 0.05 * env;
          p.leanZ = -0.07 * env + Math.sin(Math.PI * s) * 0.035 * env;
          p.armL += Math.sin(Math.PI * s) * 0.32 * env;
          p.armR += Math.sin(Math.PI * s) * 0.32 * env;

      function studio(t) {

      function sq_unroll(t) {

      function dream(t) {

        hugHeart.scale.setScalar(0.3 * hug);
        hugHeart.rotation.y = Math.sin(TAU * 0.4 * tf) * 0.2;
        cushion.scale.set(1, 1 + ring(tf, 1.6, -0.08, 6, 12), 1);
        // backdrop heart
        const bh = prog(tf, 0.05, 0.75);
        bigHeart.scale.setScalar(1.4 * E.elastic(bh, 0.45));
        bigHeart.rotation.set(0, Math.sin(TAU * 0.25 * tf) * 0.22, Math.sin(TAU * 0.18 * tf) * 0.04);
        // ring of cute things
        things.forEach((th) => {
          const pIn = prog(tf, th.delay, th.delay + 0.55);
          const s = th.base * E.outB(pIn, 2.2);
          th.g.visible = pIn > 0;
          th.g.scale.setScalar(Math.max(0.0001, s));
          th.g.position.set(th.x, th.y + Math.sin(TAU * (0.45 * tf + th.ph)) * 0.05, th.z);
          th.g.rotation.set(Math.sin(TAU * (0.3 * tf + th.ph)) * 0.12, Math.sin(TAU * (0.22 * tf + th.ph)) * 0.45 * Math.sign(th.spin) + (1 - E.outC(pIn)) * 1.5, th.rot);
        });

        const cf = prog(tf, 0.15, 0.6);

          c.m.rotation.set(c.rx + tf * c.sx, c.ry + tf * c.sy, tf);

      function overlays(t) {

        veil.style.opacity = String(t < SWITCH ? prog(t, 7.3, SWITCH) : 0);
        // heart-shaped iris opens on the dream
        const ip = prog(tf, 0.0, 0.5);
        if (t >= SWITCH && ip < 1) {
          irisPath.setAttribute("d", irisD(lerp(170, 4200, E.inOutS(ip) * 0.35 + E.inC(ip) * 0.65)));
          irisPath.style.display = "";
        } else {
          irisPath.style.display = "none";
        }
        // title, word by word, then the heart
        words.forEach((w, i) => {
          const q = prog(tf, 0.42 + i * 0.1, 0.42 + i * 0.1 + 0.5);
          w.style.opacity = String(clamp(q * 4));
          const s = q > 0 ? E.outB(q, 2.4) : 0;
          w.style.transform = `translateY(${((1 - E.outC(q)) * 40).toFixed(1)}px) scale(${s.toFixed(4)}) rotate(${((1 - E.outC(q)) * (i % 2 ? 9 : -9)).toFixed(2)}deg)`;
        });
        const hq = prog(tf, 0.75, 1.45);
        tHeart.style.opacity = String(clamp(hq * 5));
        let hs = E.elastic(hq, 0.42);
        [1.75, 2.05].forEach((bt) => { hs *= 1 + 0.14 * Math.max(0, Math.sin(Math.PI * prog(tf, bt, bt + 0.22))); });
        tHeart.style.transform = `scale(${hs.toFixed(4)}) rotate(${((1 - E.outC(hq)) * -25).toFixed(2)}deg)`;
      }

      let ready = false;
      function render(t) {
        t = clamp(t, 0, DURATION);
        if (!ready) return;
        overlays(t);
        if (t < SWITCH) {
          studio(t);
          renderer.render(s1, cam);
        } else {
          dream(t);
          renderer.render(s2, cam);
        }
      }

      // ---------------------------------------------------------------- build + timeline
      const buildReady = document.fonts.load("700 120px Fredoka").then(() => document.fonts.ready).then(() => {
        buildPaper();
        layoutLetters();
        drawPoster(0);
        renderer.compile(s1, cam);
        renderer.compile(s2, cam);
        ready = true;
        render(tl.time());
      });
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.film = buildReady;

      const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
      tl.to({ v: 0 }, { v: 1, duration: DURATION, ease: "none" }, 0);
      window.addEventListener("hf-seek", (e) => {
        const d = e && e.detail;
        if (!d || typeof d.time !== "number") return;
        render(d.time);
        if (typeof d.waitUntil === "function") d.waitUntil(buildReady);
      });
      window.__timelines["film"] = tl;
    })();
  </script>
</template>
