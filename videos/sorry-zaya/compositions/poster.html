  <script>
    const tl = gsap.timeline({ paused: true });
    const FEET = "80 98"; // svg origin at the feet, for squash and lean

    // ---------- initial states ----------
    gsap.set("#p-rig", { x: -560 });
    gsap.set("#p-hop", { y: 282 }); // eyes peek over the bottom edge at frame 0
    gsap.set("#p-shadow", { scale: 0, opacity: 0 });
    gsap.set(".p-puff", { scale: 0, opacity: 0 });
    gsap.set("#p-posterRig", { y: 400, scaleY: 0.3, opacity: 0, transformOrigin: "960px 345px" });
    gsap.set("#p-rollL", { x: 562 });
    gsap.set("#p-rollR", { x: -562 });
    gsap.set("#p-paper", { clipPath: "inset(0px 562px 0px 562px)" });
    gsap.set(".p-word", { opacity: 0, filter: "blur(8px)", y: 20 });
    gsap.set(".p-letter", { opacity: 0, scale: 0.4, y: 40, transformOrigin: "50% 80%" });
    gsap.set("#p-heart", { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
    gsap.set("#p-armL", { svgOrigin: "25 43.5", rotation: 0 });
    gsap.set("#p-armR", { svgOrigin: "135 43.5", rotation: 0 });
    gsap.set("#p-squash", { svgOrigin: FEET });
    gsap.set(["#p-eyeL", "#p-eyeR"], { transformOrigin: "50% 50%" });

    // ---------- 1. pops up from the bottom ----------
    tl.to("#p-hop", { y: 300, duration: 0.14, ease: "power2.out" }, 0.1); // little dip before the jump
    tl.to("#p-hop", { y: -70, duration: 0.42, ease: "power2.out" }, 0.25);
    tl.fromTo("#p-squash", { scaleY: 1, scaleX: 1 }, { scaleY: 1.16, scaleX: 0.9, duration: 0.18, ease: "power2.out" }, 0.25);
    tl.to("#p-squash", { scaleY: 1, scaleX: 1, duration: 0.2, ease: "sine.inOut" }, 0.45);
    tl.to("#p-hop", { y: 0, duration: 0.2, ease: "power2.in" }, 0.67);
    tl.to("#p-shadow", { scale: 1, opacity: 1, duration: 0.42, ease: "power2.in" }, 0.45);
    // landing squash, then a springy settle
    tl.to("#p-squash", { scaleY: 0.76, scaleX: 1.2, duration: 0.07, ease: "power2.out" }, 0.87);
    tl.to("#p-squash", { scaleY: 1, scaleX: 1, duration: 0.6, ease: "elastic.out(1, 0.42)" }, 0.94);
    // dust puffs
    tl.to(".p-puff", { scale: 1, opacity: 1, duration: 0.12, ease: "power2.out" }, 0.87);
    tl.to("#p-puff1", { x: -40, y: -10, duration: 0.45, ease: "power2.out" }, 0.87);
    tl.to("#p-puff2", { x: -50, y: -24, duration: 0.45, ease: "power2.out" }, 0.87);
    tl.to("#p-puff3", { x: 40, y: -10, duration: 0.45, ease: "power2.out" }, 0.87);
    tl.to("#p-puff4", { x: 50, y: -24, duration: 0.45, ease: "power2.out" }, 0.87);
    tl.to(".p-puff", { scale: 0.3, opacity: 0, duration: 0.3, ease: "power2.in" }, 1.05);
    // looks toward the centre and blinks
    tl.to("#p-eyes", { x: 6, duration: 0.16, ease: "power2.out" }, 1.08);
    tl.to(["#p-eyeL", "#p-eyeR"], { scaleY: 0.1, duration: 0.06, ease: "power2.in", yoyo: true, repeat: 1 }, 1.2);

    // ---------- 2. walks into centre frame ----------
    const W0 = 1.38, STEP = 0.3, STEPS = 6;
    tl.to("#p-rig", { x: 0, duration: STEP * STEPS, ease: "sine.inOut" }, W0);
    tl.to("#p-squash", { rotation: 5, duration: 0.25, ease: "power2.out" }, W0);
    const legsA = ["#p-leg1", "#p-leg3"], legsB = ["#p-leg2", "#p-leg4"];
    for (let i = 0; i < STEPS; i++) {
      const t = W0 + i * STEP;
      const lift = i % 2 === 0 ? legsA : legsB;
      tl.to(lift, { y: -11, duration: STEP / 2, ease: "sine.out" }, t);
      tl.to(lift, { y: 0, duration: STEP / 2, ease: "sine.in" }, t + STEP / 2);
      tl.to("#p-body", { y: -5, duration: STEP / 2, ease: "sine.out" }, t);
      tl.to("#p-body", { y: 0, duration: STEP / 2, ease: "sine.in" }, t + STEP / 2);
      tl.to("#p-armL", { rotation: i % 2 === 0 ? 16 : -12, duration: STEP, ease: "sine.inOut" }, t);
      tl.to("#p-armR", { rotation: i % 2 === 0 ? 12 : -16, duration: STEP, ease: "sine.inOut" }, t);
    }
    const STOP = W0 + STEP * STEPS; // 3.18
    tl.to(["#p-armL", "#p-armR"], { rotation: 0, duration: 0.2, ease: "power2.out" }, STOP);
    // follow-through: leans back past upright, then settles
    tl.to("#p-squash", { rotation: -4, duration: 0.16, ease: "power2.out" }, STOP);
    tl.to("#p-squash", { rotation: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }, STOP + 0.16);
    // faces the camera, blinks
    tl.to("#p-eyes", { x: 0, duration: 0.16, ease: "power2.out" }, STOP + 0.22);
    tl.to(["#p-eyeL", "#p-eyeR"], { scaleY: 0.1, duration: 0.06, ease: "power2.in", yoyo: true, repeat: 1 }, STOP + 0.38);

    // ---------- 3. pulls out a gigantic poster ----------
    const PULL = 3.8;
    // anticipation: crouch, arm reaches behind
    tl.to("#p-squash", { scaleY: 0.87, scaleX: 1.08, duration: 0.18, ease: "power2.out" }, PULL);
    tl.to("#p-armR", { rotation: 75, duration: 0.18, ease: "power2.out" }, PULL);
    tl.to("#p-armL", { rotation: 25, duration: 0.2, ease: "power2.out" }, PULL + 0.03);
    tl.to("#p-eyes", { x: 4, y: -2, duration: 0.12, ease: "power2.out" }, PULL);
    // the yank: stretch up, both arms shoot up to hold it
    tl.to("#p-squash", { scaleY: 1.1, scaleX: 0.94, duration: 0.14, ease: "power2.out" }, PULL + 0.2);
    tl.to("#p-squash", { scaleY: 1, scaleX: 1, duration: 0.55, ease: "elastic.out(1, 0.5)" }, PULL + 0.34);
    tl.to("#p-armR", { rotation: -80, scaleX: 2.75, duration: 0.32, ease: "back.out(1.6)" }, PULL + 0.22);
    tl.to("#p-armL", { rotation: 80, scaleX: 2.75, duration: 0.34, ease: "back.out(1.6)" }, PULL + 0.25);
    tl.to("#p-eyes", { x: 0, y: -3, duration: 0.2, ease: "power2.out" }, PULL + 0.25);
    tl.to("#p-posterRig", { opacity: 1, duration: 0.05 }, PULL + 0.2);
    tl.to("#p-posterRig", { y: 0, scaleY: 1, duration: 0.48, ease: "back.out(1.3)" }, PULL + 0.2);

    // unrolls sideways
    const UNROLL = PULL + 0.66; // 4.46
    tl.to("#p-rollL", { x: 0, duration: 0.62, ease: "power3.inOut" }, UNROLL);
    tl.to("#p-rollR", { x: 0, duration: 0.62, ease: "power3.inOut" }, UNROLL);
    tl.to("#p-paper", { clipPath: "inset(0px 0px 0px 0px)", duration: 0.62, ease: "power3.inOut" }, UNROLL);

    // ---------- 4. the words land ----------
    const TXT = UNROLL + 0.5; // 4.96
    tl.to("#p-w1", { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.22, ease: "power3.out" }, TXT);
    tl.to("#p-w2", { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.22, ease: "power3.out" }, TXT + 0.1);
    ["#p-l1", "#p-l2", "#p-l3", "#p-l4"].forEach((sel, i) => {
      tl.to(sel, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(2.2)" }, TXT + 0.34 + i * 0.08);
    });
    const HEART = TXT + 0.72; // 5.68
    tl.fromTo("#p-heart", { scale: 0, opacity: 0, rotation: -25 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "elastic.out(1, 0.45)" }, HEART);

    // the mascot's apology face: a little take, puppy eyes, blush, a tear
    tl.to("#p-squash", { scaleY: 0.95, scaleX: 1.03, duration: 0.08, ease: "power2.out" }, TXT + 0.05);
    tl.to("#p-squash", { scaleY: 1, scaleX: 1, duration: 0.4, ease: "elastic.out(1, 0.5)" }, TXT + 0.13);
    tl.to("#p-eyeN", { opacity: 0, duration: 0.06 }, TXT + 0.1);
    tl.to("#p-eyeP", { opacity: 1, duration: 0.06 }, TXT + 0.1);
    tl.to("#p-eyes", { y: 0, duration: 0.2, ease: "power2.out" }, TXT + 0.1);
    tl.to("#p-mouth", { opacity: 1, duration: 0.1 }, TXT + 0.14);
    tl.to("#p-blush", { opacity: 1, duration: 0.4, ease: "power1.out" }, TXT + 0.25);
    tl.fromTo("#p-tear", { opacity: 0, y: 0 }, { opacity: 1, duration: 0.15 }, 5.95);
    tl.to("#p-tear", { y: 16, duration: 0.6, ease: "power1.in" }, 6.0);
    tl.to("#p-tear", { opacity: 0, duration: 0.15 }, 6.5);
    // a shy little head tilt while it waits
    tl.to("#p-squash", { rotation: -2.5, duration: 0.5, ease: "sine.inOut" }, 5.6);
    tl.to("#p-squash", { rotation: 1.5, duration: 0.5, ease: "sine.inOut" }, 6.1);

    // heart beats twice
    [6.05, 6.38].forEach((t) => {
      tl.to("#p-heartInner", { scale: 1.16, svgOrigin: "50 45", duration: 0.1, ease: "power2.out" }, t);
      tl.to("#p-heartInner", { scale: 1, svgOrigin: "50 45", duration: 0.2, ease: "power2.in" }, t + 0.1);
    });

    // ---------- 5. the heart becomes the world ----------
    const ZOOM = 6.72;
    tl.to("#p-heartShine", { opacity: 0, duration: 0.12 }, ZOOM);
    tl.to("#p-heart", { x: -290, y: 103, scale: 70, duration: 0.56, ease: "power3.in" }, ZOOM);
    tl.to("#p-heartPath", { attr: { fill: "#ffc4d6" }, duration: 0.5, ease: "power1.in" }, ZOOM + 0.05);
    tl.to("#p-world", { filter: "blur(14px)", duration: 0.4, ease: "power2.in" }, ZOOM + 0.08);

    window.__timelines["poster"] = tl;
  </script>
