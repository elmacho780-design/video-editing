  <div id="root" data-composition-id="finale" data-width="1920" data-height="1080">

        <!-- dotted sticker-book frame -->
        <svg id="f-frameSvg" width="1920" height="1080" viewBox="0 0 1920 1080">
          <rect id="f-frame" x="110" y="78" width="1700" height="924" rx="64" fill="none" stroke="#ffffff" stroke-width="9" stroke-dasharray="1 24" stroke-linecap="round" />
          <rect id="f-frame2" x="136" y="104" width="1648" height="872" rx="48" fill="none" stroke="#ff8fb1" stroke-width="4" opacity="0.7" />
        </svg>

        <div id="f-rise"></div>

        <div id="f-title" data-layout-allow-overlap>
          <span id="f-w1" class="f-word">I’m</span><span id="f-w2" class="f-word">sorry,</span><span id="f-w3" class="f-word">Zaya</span><svg id="f-titleHeart" viewBox="0 0 100 90">
            <path d="M50 88 C20 66 2 48 2 28 C2 13 13 2 27 2 C37 2 45 8 50 17 C55 8 63 2 73 2 C87 2 98 13 98 28 C98 48 80 66 50 88Z" fill="#ff4f86" stroke="#ffffff" stroke-width="7" paint-order="stroke" />

                <rect x="50" y="72" width="12" height="26" rx="3" fill="#c96a4b" />
                <rect x="98" y="72" width="12" height="26" rx="3" fill="#c96a4b" />
                <rect x="118" y="72" width="12" height="26" rx="3" fill="#d97757" />
                <g id="f-body">

          <svg id="f-mini2" class="f-mini" style="left: 190px; top: -30px" width="34" height="31" viewBox="0 0 100 90"><path d="M50 88 C20 66 2 48 2 28 C2 13 13 2 27 2 C37 2 45 8 50 17 C55 8 63 2 73 2 C87 2 98 13 98 28 C98 48 80 66 50 88Z" fill="#ff8fb1" /></svg>
          <svg id="f-mini3" class="f-mini" style="left: 248px; top: -6px" width="40" height="36" viewBox="0 0 100 90"><path d="M50 88 C20 66 2 48 2 28 C2 13 13 2 27 2 C37 2 45 8 50 17 C55 8 63 2 73 2 C87 2 98 13 98 28 C98 48 80 66 50 88Z" fill="#ffffff" /></svg>

  <script>
    // ---------- deterministic sticker layout ----------
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20260214);
    const HEART = "M50 88 C20 66 2 48 2 28 C2 13 13 2 27 2 C37 2 45 8 50 17 C55 8 63 2 73 2 C87 2 98 13 98 28 C98 48 80 66 50 88Z";
    const SPARK = "M50 0 C55 35 65 45 100 50 C65 55 55 65 50 100 C45 65 35 55 0 50 C35 45 45 35 50 0Z";
    function starPts() {
      const p = [];
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? 44 : 20, a = -Math.PI / 2 + (i * Math.PI) / 5;
        p.push((50 + r * Math.cos(a)).toFixed(1) + "," + (52 + r * Math.sin(a)).toFixed(1));
      }
      return p.join(" ");
    }
    const SHAPES = {
      heart: (c) => `<svg viewBox="0 0 100 90"><path d="${HEART}" fill="${c}" stroke="#fff" stroke-width="8" paint-order="stroke"/><ellipse cx="28" cy="23" rx="9" ry="5.5" transform="rotate(-30 28 23)" fill="#fff" opacity=".55"/></svg>`,
      star: (c) => `<svg viewBox="0 0 100 100"><polygon points="${starPts()}" fill="${c}" stroke="${c}" stroke-width="10" stroke-linejoin="round"/><polygon points="${starPts()}" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" transform="translate(50 52) scale(1.18) translate(-50 -52)"/></svg>`,
      spark: (c) => `<svg viewBox="0 0 100 100"><path d="${SPARK}" fill="${c}"/></svg>`,
      flower: (c) => {
        let s = `<svg viewBox="0 0 100 100">`;
        for (let i = 0; i < 5; i++) {
          const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
          s += `<circle cx="${(50 + 24 * Math.cos(a)).toFixed(1)}" cy="${(50 + 24 * Math.sin(a)).toFixed(1)}" r="19" fill="${c}" stroke="#fff" stroke-width="4"/>`;
        }
        return s + `<circle cx="50" cy="50" r="14" fill="#ffd34d" stroke="#fff" stroke-width="4"/></svg>`;
      },
      cloud: () => `<svg viewBox="0 0 100 70"><path d="M24 62 C10 62 4 52 6 43 C8 34 17 30 25 32 C26 18 38 8 52 10 C64 12 71 21 72 30 C84 28 95 36 95 48 C95 58 87 63 78 62 Z" fill="#fff"/><circle cx="40" cy="42" r="3.2" fill="#24150f"/><circle cx="60" cy="42" r="3.2" fill="#24150f"/><path d="M45 49 Q50 53 55 49" fill="none" stroke="#24150f" stroke-width="2.6" stroke-linecap="round"/><ellipse cx="33" cy="49" rx="4" ry="2.4" fill="#ff8fab"/><ellipse cx="67" cy="49" rx="4" ry="2.4" fill="#ff8fab"/></svg>`,
    };
    const KINDS = [
      ["heart", "#ff4f86"], ["star", "#ffd34d"], ["spark", "#ffffff"], ["heart", "#ff8fb1"],
      ["flower", "#c4b0ff"], ["cloud", ""], ["heart", "#ff3d6e"], ["spark", "#fff3a6"],
      ["star", "#ffb3c9"], ["flower", "#9fe3cf"], ["heart", "#ffffff"], ["star", "#c4b0ff"],
    ];
    const spots = [];
    for (let i = 0; i < 9; i++) spots.push([150 + i * 202 + (rand() - 0.5) * 50, 70 + (rand() - 0.5) * 30]);
    for (let i = 0; i < 9; i++) spots.push([250 + i * 202 + (rand() - 0.5) * 50, 1010 + (rand() - 0.5) * 30]);
    for (let i = 0; i < 4; i++) spots.push([86 + (rand() - 0.5) * 24, 250 + i * 190 + (rand() - 0.5) * 40]);
    for (let i = 0; i < 4; i++) spots.push([1834 + (rand() - 0.5) * 24, 210 + i * 190 + (rand() - 0.5) * 40]);
    // a few bigger ones that keep the mascot company
    const accents = [
      [520, 720, "heart", "#ff4f86", 132, -14],
      [1408, 700, "star", "#ffd34d", 118, 12],
      [610, 540, "spark", "#ffffff", 64, 0],
      [1320, 520, "heart", "#ffffff", 74, 16],
      [350, 520, "cloud", "", 150, -4],
      [1590, 520, "cloud", "", 132, 5],
    ];
    const stickers = document.getElementById("f-stickers");
    const all = [];
    spots.forEach(([x, y], i) => {
      const [k, c] = KINDS[i % KINDS.length];
      const size = k === "cloud" ? 120 + rand() * 30 : 64 + rand() * 50;
      all.push([x, y, k, c, size, (rand() - 0.5) * 50]);
    });
    accents.forEach((a) => all.push(a));
    const stickerEls = [];
    all.forEach(([x, y, k, c, size, rot], i) => {
      const el = document.createElement("div");
      el.className = "f-sticker";
      el.id = "f-st" + i;
      el.dataset.kind = k;
      const h = k === "cloud" ? size * 0.7 : k === "heart" ? size * 0.9 : size;
      el.style.cssText = `left:${(x - size / 2).toFixed(1)}px;top:${(y - h / 2).toFixed(1)}px;width:${size.toFixed(1)}px;height:${h.toFixed(1)}px`;
      el.innerHTML = SHAPES[k](c);
      el.firstChild.setAttribute("width", "100%");
      el.firstChild.setAttribute("height", "100%");
      el.dataset.rot = rot.toFixed(1);
      el.dataset.ang = Math.atan2(y - 540, x - 960);
      stickers.appendChild(el);
      stickerEls.push(el);
    });

    // rising hearts behind everything
    const rise = document.getElementById("f-rise");
    const risers = [];
    for (let i = 0; i < 16; i++) {
      const el = document.createElement("div");
      el.className = "f-riser";
      el.id = "f-r" + i;
      const s = 26 + rand() * 34;
      const x = 180 + rand() * 1560, y = 360 + rand() * 760;
      el.style.cssText = `left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${s.toFixed(1)}px;height:${(s * 0.9).toFixed(1)}px`;
      el.innerHTML = `<svg viewBox="0 0 100 90" width="100%" height="100%"><path d="${HEART}" fill="${i % 3 === 0 ? "#ff6f9a" : "#ffffff"}" opacity="${(0.55 + rand() * 0.35).toFixed(2)}"/></svg>`;
      rise.appendChild(el);
      risers.push({ el, dist: 320 + rand() * 260, sway: 18 + rand() * 26 });
    }

    // ---------- timeline ----------
    const tl = gsap.timeline({ paused: true });
    const END = 2.75;

    // seam: the heart's flat pink gives way to the world
    tl.fromTo("#f-flash", { opacity: 1 }, { opacity: 0, duration: 0.32, ease: "power2.out" }, 0.04);
    tl.fromTo("#f-rays", { rotation: 0, opacity: 0, scale: 0.9 }, { rotation: 12, duration: END, ease: "none" }, 0);
    tl.to("#f-rays", { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 0.05);
    tl.fromTo("#f-frameSvg", { opacity: 0, scale: 1.05, transformOrigin: "960px 540px" }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.1);

    // stickers pop in around the frame, sweeping out from the top centre both ways
    const order = stickerEls
      .map((el) => ({ el, d: Math.abs(Math.atan2(Math.sin(+el.dataset.ang + Math.PI / 2), Math.cos(+el.dataset.ang + Math.PI / 2))) }))
      .sort((a, b) => a.d - b.d);
    order.forEach(({ el }, i) => {
      const rot = +el.dataset.rot;
      tl.fromTo(el, { scale: 0, rotation: rot - 40, opacity: 0 }, { scale: 1, rotation: rot, opacity: 1, duration: 0.5, ease: "back.out(2.4)" }, 0.12 + i * 0.022);
    });
    // a couple of sparkle twinkles
    stickerEls.filter((el) => el.dataset.kind === "spark").forEach((el, i) => {
      const t = 1.3 + (i % 3) * 0.28;
      tl.to(el, { scale: 1.3, duration: 0.14, ease: "power2.out" }, t);
      tl.to(el, { scale: 1, duration: 0.3, ease: "power2.inOut" }, t + 0.14);
    });

    // rising hearts
    risers.forEach(({ el, dist, sway }, i) => {
      tl.fromTo(el, { y: 0, opacity: 0 }, { y: -dist, duration: END, ease: "none" }, 0);
      tl.to(el, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.1 + (i % 4) * 0.05);
      tl.fromTo(el, { x: -sway }, { x: sway, duration: END / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
    });

    // title: word by word
    ["#f-w1", "#f-w2", "#f-w3"].forEach((sel, i) => {
      tl.fromTo(sel, { opacity: 0, scale: 0.5, filter: "blur(6px)", transformOrigin: "50% 70%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "back.out(2)" }, 0.22 + i * 0.1);
    });
    tl.fromTo("#f-titleHeart", { opacity: 0, scale: 0, rotation: -30, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: "elastic.out(1, 0.45)" }, 0.55);

    // mascot springs out of the pink, hugging a heart
    tl.fromTo("#f-rig", { scale: 0.15, rotation: -14, opacity: 0, transformOrigin: "50% 85%" }, { scale: 1, rotation: 0, opacity: 1, duration: 0.85, ease: "elastic.out(1, 0.5)" }, 0.1);
    tl.set("#f-squash", { svgOrigin: "80 98" }, 0);
    // a happy hop
    const HOP = 1.02;
    tl.to("#f-squash", { scaleY: 0.86, scaleX: 1.1, duration: 0.1, ease: "power2.out" }, HOP);
    tl.to("#f-hop", { y: -48, duration: 0.2, ease: "power2.out" }, HOP + 0.1);
    tl.to("#f-squash", { scaleY: 1.1, scaleX: 0.93, duration: 0.12, ease: "power2.out" }, HOP + 0.1);
    tl.to("#f-squash", { scaleY: 1, scaleX: 1, duration: 0.14, ease: "sine.inOut" }, HOP + 0.22);
    tl.to("#f-shadow", { scale: 0.7, opacity: 0.6, duration: 0.2, ease: "power2.out" }, HOP + 0.1);
    tl.to("#f-hop", { y: 0, duration: 0.18, ease: "power2.in" }, HOP + 0.3);
    tl.to("#f-shadow", { scale: 1, opacity: 1, duration: 0.18, ease: "power2.in" }, HOP + 0.3);
    tl.to("#f-squash", { scaleY: 0.84, scaleX: 1.14, duration: 0.07, ease: "power2.out" }, HOP + 0.48);
    tl.to("#f-squash", { scaleY: 1, scaleX: 1, duration: 0.55, ease: "elastic.out(1, 0.42)" }, HOP + 0.55);
    // squeezes the heart twice
    [1.68, 1.98].forEach((t) => {
      tl.to("#f-hug", { scale: 1.14, svgOrigin: "80 73", duration: 0.1, ease: "power2.out" }, t);
      tl.to("#f-hug", { scale: 1, svgOrigin: "80 73", duration: 0.2, ease: "power2.in" }, t + 0.1);
    });
    // ...and little hearts float up from it
    [["#f-mini1", 0, -26], ["#f-mini2", 0.1, 4], ["#f-mini3", 0.2, 30]].forEach(([sel, d, dx]) => {
      tl.fromTo(sel, { opacity: 0, scale: 0.3, y: 30, x: 0 }, { opacity: 1, scale: 1, y: -40, x: dx * 0.5, duration: 0.3, ease: "back.out(2)" }, 1.72 + d);
      tl.to(sel, { y: -150, x: dx, opacity: 0, duration: 0.7, ease: "power1.in" }, 2.02 + d);
    });
    // happy sway to the end
    tl.to("#f-squash", { rotation: -3, duration: 0.35, ease: "sine.inOut" }, 2.1);
    tl.to("#f-squash", { rotation: 2, duration: 0.3, ease: "sine.inOut" }, 2.45);

    window.__timelines["finale"] = tl;
  </script>
