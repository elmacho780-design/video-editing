<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="film"
        data-composition-id="film"
        data-composition-src="compositions/film.html"
        data-start="0"
        data-duration="10"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- sound on the visible actions; each peak lands one frame after its picture -->
      <audio id="sfx-spring" src="assets/sfx/whoosh-short.mp3" data-start="0.34" data-duration="0.57" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-land" src="assets/sfx/pop.mp3" data-start="0.88" data-duration="0.72" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-yank" src="assets/sfx/whoosh.mp3" data-start="4.14" data-duration="0.57" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-bow" src="assets/sfx/pop.mp3" data-start="4.6" data-duration="0.72" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-bowshine" src="assets/sfx/sparkle.mp3" data-start="4.69" data-duration="1.8" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-unroll" src="assets/sfx/whoosh-short.mp3" data-start="4.79" data-duration="0.57" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-name" src="assets/sfx/pop.mp3" data-start="5.75" data-duration="0.72" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-heart" src="assets/sfx/sparkle.mp3" data-start="6.11" data-duration="1.8" data-track-index="14" data-volume="0.45"></audio>
      <audio id="sfx-leap" src="assets/sfx/whoosh.mp3" data-start="6.94" data-duration="0.57" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-dream" src="assets/sfx/chime.mp3" data-start="7.06" data-duration="2.5" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-title" src="assets/sfx/sparkle.mp3" data-start="8.21" data-duration="1.75" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-hop" src="assets/sfx/pop.mp3" data-start="8.92" data-duration="0.72" data-track-index="11" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
