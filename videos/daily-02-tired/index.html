<!doctype html>
<html><head><meta charset="utf-8"><title>Daily English Day 2</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="src/base.css">
</head><body><div id="stage"></div>
<script type="module">
const q = new URLSearchParams(location.search);
const view = q.get('view') || 'frames';
await Promise.all(['900 80px Montserrat', '800 80px Montserrat', '700 60px Montserrat', '900 60px "Montserrat Outline"', '800 40px Manrope', '700 40px Manrope', '700 60px Caveat']
  .map((f) => document.fonts.load(f, 'Ядарсан туйлдсан ҮӨ үө tired exhausted 123')));
const mod = await import(`./src/${view}.js`);
window.DUR = mod.DUR || 1;
if (mod.init) await mod.init(q);
window.render = (t) => mod.frame(t, q);
await window.render(+(q.get('t') || 0));
window.READY = true;
</script></body></html>
